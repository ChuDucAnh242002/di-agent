# The demo's agent: the case study's, on a compressed timetable.
node: { addr: "0.0.0.0:9090" }
sources:
  interval: 5s
  netdata: { url: http://localhost:19999 }
  # The node's other consumers, beside its pods: the agent itself, its decision model, k0s
  # (with its own containerd), the system containerd and Netdata. Every other unit is in
  # the node total and in no subject.
  cgroup: { units: [di-agent.service, ollama.service, k0scontroller.service, containerd.service, netdata.service] }
runtime: { kind: kubernetes, kubeconfig: /var/lib/k0s/pki/admin.conf }
loops:
  # The agent reviews discovery's candidates on its own: rules, then tier 1 on this node
  # (tier1.sh: Ollama on CPUs 6-9, which no pod can use, 9 GB), then the reasoning model on the host
  # through tunnel.sh. Nothing waits for a person.
  review:
    level: full
    decision: { backend: systemone, url: "http://localhost:11434", model: "tev1:4b-node" }
    reasoning: { backend: openai-tools, url: "http://localhost:11435/v1", model: "qwen3.8:27b-nvfp4" }
  relief: { enabled: true }
persist:
  file: /var/lib/di-agent/state.json
domain: { path: none }
