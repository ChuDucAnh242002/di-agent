# The case study's agent: the kubernetes runtime, the review loop deciding on its own,
# the map kept on disk.
# agent-relief.yaml is identical except that relief is on; the run switches to it at P3.
node: { addr: "0.0.0.0:9090" }
sources:
  interval: 5s
  collectors:
    # The node's other consumers, beside its pods: the agent itself, its decision model, k0s
    # (with its own containerd), the system containerd and Netdata. Every other unit is in
    # the node total and in no subject.
    - name: cgroup
      type: cgroup
      config: { units: [di-agent.service, ollama.service, k0scontroller.service, containerd.service, netdata.service] }
    # After cgroup, which supplies the node's own types; collapse: false keeps Netdata's
    # system charts from feeding cpu_utilization a second time.
    - name: netdata
      type: netdata
      config: { url: http://localhost:19999, collapse: false }
runtime: { kind: kubernetes, kubeconfig: /var/lib/k0s/pki/admin.conf }
loops:
  # The agent reviews discovery's candidates on its own, on this node: rules, then the decision
  # model (tier1.sh: Ollama on CPUs 6-11, which no pod can use, 6-9 GB). Nothing waits for a person.
  review:
    level: full
    # Kept loaded: a model unloading and reloading swings node memory by gigabytes, which the
    # map would read as the node's behaviour.
    decision: { backend: systemone, url: "http://localhost:11434", model: "tev1:4b-node", keep_alive: "24h" }
    # No reasoning tier on this node (tier1.sh says why): what rules and the decision model are
    # not sure of stays undecided until its evidence moves, and is reviewed again then.
    reasoning: { backend: none }
  relief: { enabled: true }
persist:
  file: /var/lib/di-agent/state.json
# No domain model: the map holds what the node exhibits and what it discovers or
# measures. Without this the agent searches upward for a domain_spec.json and takes
# whatever it finds (the 2026-10-19 run found one in the home directory).
domain: { path: none }
