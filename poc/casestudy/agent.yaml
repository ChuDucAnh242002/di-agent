# The case study's agent: the kubernetes runtime, the review loop deciding on its own,
# the map kept on disk.
# agent-relief.yaml is identical except that relief is on; the run switches to it at P3.
node: { addr: "0.0.0.0:9090" }
sources:
  interval: 5s
  netdata: { url: http://localhost:19999 }
runtime: { kind: kubernetes, kubeconfig: /var/lib/k0s/pki/admin.conf }
loops:
  # The agent reviews discovery's candidates on its own: rules, then tier 1 on this node
  # (tier1.sh: Ollama held to two CPUs and 7 GB), then the reasoning model on the host
  # through tunnel.sh. Nothing waits for a person.
  review:
    level: full
    decision: { backend: systemone, url: "http://localhost:11434", model: "tev1:4b" }
    reasoning: { backend: openai-tools, url: "http://localhost:11435/v1", model: "qwen3.8:27b-nvfp4" }
  relief: { enabled: false }
persist:
  file: /var/lib/di-agent/state.json
# No domain model: the map holds what the node exhibits and what it discovers or
# measures. Without this the agent searches upward for a domain_spec.json and takes
# whatever it finds (the 2026-10-19 run found one in the home directory).
domain: { path: none }
