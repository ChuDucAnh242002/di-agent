# The case study's agent: the kubernetes runtime, the review loop deciding on its own,
# the map kept on disk.
# agent-relief.yaml is identical except that relief is on; the run switches to it at P3.
node: { addr: "0.0.0.0:9090" }
sources:
  interval: 5s
  netdata: { url: http://localhost:19999 }
  # The node's other consumers, beside its pods: the agent itself, its decision model, k0s
  # (with its own containerd), the system containerd and Netdata. Every other unit is in
  # the node total and in no subject.
  cgroup: { units: [di-agent.service, ollama.service, k0scontroller.service, containerd.service, netdata.service] }
runtime: { kind: kubernetes, kubeconfig: /var/lib/k0s/pki/admin.conf }
loops:
  # The agent reviews discovery's candidates on its own, every tier on this node: rules, the
  # decision model, then the reasoning model (tier1.sh: Ollama on CPUs 6-11, which no pod can
  # use, 13 GB). Nothing waits for a person.
  review:
    level: full
    decision: { backend: systemone, url: "http://localhost:11434", model: "tev1:4b-node" }
    reasoning: { backend: openai-tools, url: "http://localhost:11434/v1", model: "qwen3:8b-node" }
  relief: { enabled: false }
persist:
  file: /var/lib/di-agent/state.json
# No domain model: the map holds what the node exhibits and what it discovers or
# measures. Without this the agent searches upward for a domain_spec.json and takes
# whatever it finds (the 2026-10-19 run found one in the home directory).
domain: { path: none }
