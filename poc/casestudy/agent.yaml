# The case study's agent: the kubernetes runtime, no review loop (every confirmed
# relationship is the operator's or an intervention's), the map kept on disk.
# agent-relief.yaml is identical except that relief is on; the run switches to it at P3.
node: { addr: "0.0.0.0:9090" }
sources:
  interval: 5s
  netdata: { url: http://localhost:19999 }
runtime: { kind: kubernetes, kubeconfig: /var/lib/k0s/pki/admin.conf }
loops:
  review: { level: "off" }
  relief: { enabled: false }
persist:
  file: /var/lib/di-agent/state.json
# No domain model: the map holds what the node exhibits and what it discovers or
# measures. Without this the agent searches upward for a domain_spec.json and takes
# whatever it finds (the 2026-10-19 run found one in the home directory).
domain: { path: none }
