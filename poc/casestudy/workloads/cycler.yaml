apiVersion: v1
kind: Pod
metadata: { name: cycler, labels: { check: casestudy, di-agent/group: compute } }
spec:
  containers:
  - name: cycler
    image: busybox:1.36
    command: ["sh", "-c", "while true; do timeout 45 sh -c 'while :; do :; done'; sleep 45; done"]
    resources:
      requests: { cpu: 100m, memory: 16Mi }
      limits:   { cpu: "1", memory: 64Mi }
