# A steady CPU load for the relief phase: six busy loops under a 4.5-core limit, so with
# the victim beside it the node's six CPUs are oversubscribed (1.5x, as on the 4-CPU node) and any limit the agent
# sets below its usage binds. Burstable, one container, with a
# CPU limit: the kind of pod the kubernetes runtime will resize in place.
apiVersion: v1
kind: Pod
metadata: { name: hog, labels: { check: casestudy } }
spec:
  containers:
  - name: w
    image: busybox:1.36
    command: ["sh", "-c", "for i in 1 2 3 4 5 6; do (while :; do :; done) & done; wait"]
    resources: { requests: { cpu: 100m, memory: 8Mi }, limits: { cpu: "4500m", memory: 32Mi } }
