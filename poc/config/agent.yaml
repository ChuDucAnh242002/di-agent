# The PoC agent's spec. Installed at /etc/di-agent/agent.yaml; ${VAR} is read from
# /etc/di-agent/env, so each VM names itself and picks its regime there.
node:
  addr: ":9090"
  id: ${NODE_ID}
profile:
  kd: k0s
  regime: ${REGIME}
sources:
  interval: 5s
  # cgroup first: it supplies the node's own types, and Netdata (collapse: false) adds
  # its charts beside them without feeding cpu_utilization a second time.
  collectors:
    - name: cgroup
      type: cgroup
    - name: netdata
      type: netdata
      config: { url: http://localhost:19999, collapse: false }
map:
  proposer:
    enabled: false
