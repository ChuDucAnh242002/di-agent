# What the di-agent `kubernetes` runtime needs: list pods, patch a pod's
# annotation, and resize a pod's CPU limit in place. Nothing else.
# The DaemonSet that runs the agent is not part of this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: di-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: di-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: di-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: di-agent
subjects:
  - kind: ServiceAccount
    name: di-agent
    namespace: kube-system
