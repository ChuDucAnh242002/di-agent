name: CI

# Runs on every push to main and every PR targeting main.
# Validates that the semantic-map Go module builds, vets clean, and that
# the full test suite (compliance + scenarios + evolution + integration)
# passes with race detection on.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test + vet
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: semantic-map/go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: semantic-map/go/go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod / go.sum need 'go mod tidy'"
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector, 5m timeout)
        run: go test -race -timeout 5m ./...

  demo:
    name: dev.sh demo (smoke)
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: semantic-map/go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: semantic-map/go/go.sum

      - name: Run guided demo in paper mode
        run: ./dev.sh demo --paper

  build-push-images:
    name: build + push images (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: genset
            context: poc2/system/genset
          - service: switchboard
            context: poc2/system/switchboard
          - service: propulsion
            context: poc2/system/propulsion
          - service: battery
            context: poc2/system/battery
          - service: shore-power
            context: poc2/system/shore-power
          - service: auxload
            context: poc2/system/auxiliary-load
          - service: telemetry-writer
            context: poc2/system/telemetry-writer
          - service: playground
            context: poc2/playground

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/chuducanh242002/${{ matrix.service }}:latest
            ghcr.io/chuducanh242002/${{ matrix.service }}:${{ github.sha }}
          # Links the image to this repo so GITHUB_TOKEN keeps write access to the package.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
