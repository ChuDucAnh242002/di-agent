name: CI

# Runs on every push to main and every PR targeting main.
# Validates that the semantic-map Go module builds, vets clean, and that
# the full test suite (compliance + scenarios + evolution + integration)
# passes with race detection on. Also runs the poc2/system pytest suite, the
# poc2/bdd godog scenarios (fake in-process peers, no live cluster), the
# poc2/playground Cypress suite (stubbed spec only, no live cluster), and a
# kind-based Helm smoke test that deploys the full di-agent-system chart to
# an ephemeral in-runner cluster.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test + vet
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: semantic-map/go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: semantic-map/go/go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod / go.sum need 'go mod tidy'"
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector, 5m timeout)
        run: go test -race -timeout 5m ./...

  demo:
    name: dev.sh demo (smoke)
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: semantic-map/go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: semantic-map/go/go.sum

      - name: Run guided demo in paper mode
        run: ./dev.sh demo --paper

  system-tests:
    name: poc2/system pytest suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: poc2/system/**/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          for req in poc2/system/*/requirements.txt; do
            pip install -r "$req"
          done

      - name: Run pytest
        run: pytest poc2/system/tests/

  bdd-tests:
    name: poc2/bdd godog scenarios (no live cluster)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: poc2/bdd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: poc2/bdd/go.sum

      - name: Run godog scenarios
        run: go test ./...

  kind-smoke-test:
    name: kind Helm smoke test (di-agent-system chart)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          install_only: false
          cluster_name: di-agent-smoke

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build chart-managed images
        run: |
          set -euo pipefail
          declare -A contexts=(
            [genset]=poc2/system/genset
            [switchboard]=poc2/system/switchboard
            [propulsion]=poc2/system/propulsion
            [battery]=poc2/system/battery
            [shore-power]=poc2/system/shore-power
            [auxload]=poc2/system/auxiliary-load
            [telemetry-writer]=poc2/system/telemetry-writer
            [navigation]=poc2/system/navigation
            [playground]=poc2/playground
          )
          for service in "${!contexts[@]}"; do
            docker build -t "smoke/${service}:test" "${contexts[$service]}"
          done

      - name: Load images into kind
        run: |
          set -euo pipefail
          for service in genset switchboard propulsion battery shore-power auxload telemetry-writer navigation playground; do
            kind load docker-image "smoke/${service}:test" --name di-agent-smoke
          done

      - name: Create required secrets
        run: |
          kubectl create secret generic influxdb-credentials \
            --from-literal=admin-user=admin \
            --from-literal=admin-password=smoke-test-password \
            --from-literal=admin-token=smoke-test-token
          kubectl create secret generic grafana-credentials \
            --from-literal=admin-user=admin \
            --from-literal=admin-password=smoke-test-password

      - name: Helm install (values pointed at locally-loaded images)
        run: |
          helm upgrade --install di-agent-system poc2/helm/di-agent-system \
            --set global.imageRegistry=smoke \
            --set global.imageTag=test \
            --set global.imagePullPolicy=IfNotPresent \
            --wait --timeout 6m0s

      - name: Smoke-test genset REST endpoint
        run: |
          kubectl run smoke-curl --image=curlimages/curl --restart=Never --rm -i \
            --command -- curl -sf --max-time 10 http://genset-1:8000/cost

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs -l app=genset --all-containers --tail=200 || true

  playground-tests:
    name: poc2/playground cypress suite (no live cluster)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: poc2/playground

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: poc2/playground/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run Cypress tests (stubbed, non-live)
        uses: cypress-io/github-action@v6
        with:
          working-directory: poc2/playground
          install: false
          start: npm run preview -- --port 4173
          wait-on: 'http://localhost:4173'
          spec: cypress/e2e/playground.cy.ts

  build-push-images:
    name: build + push images (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: genset
            context: poc2/system/genset
          - service: switchboard
            context: poc2/system/switchboard
          - service: propulsion
            context: poc2/system/propulsion
          - service: battery
            context: poc2/system/battery
          - service: shore-power
            context: poc2/system/shore-power
          - service: auxload
            context: poc2/system/auxiliary-load
          - service: telemetry-writer
            context: poc2/system/telemetry-writer
          - service: playground
            context: poc2/playground

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/chuducanh242002/${{ matrix.service }}:latest
            ghcr.io/chuducanh242002/${{ matrix.service }}:${{ github.sha }}
          # Links the image to this repo so GITHUB_TOKEN keeps write access to the package.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
