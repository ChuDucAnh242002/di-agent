name: Disposable operations lab

on:
  pull_request:
    paths:
      - poc2/operations/**
      - .github/workflows/operations-lab.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exercise:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: semantic-map/go/go.mod
          cache-dependency-path: semantic-map/go/go.sum
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: Deploy, measure, fail, recover, roll back and tear down
        run: node poc2/operations/lab.mjs
